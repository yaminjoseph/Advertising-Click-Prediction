<!DOCTYPE html>
<html>

<head>
    <title>AD CLICK PREDICTION</title>
    <link rel="stylesheet" type="text/css" href="/html_static/style.css">
</head>

<body>
    <div class="container">
        <h2>AD CLICK PREDICTION</h2>
        <form action="/predict" method="POST">
            <label for="daily_internet_usage">DAILY INTERNET USAGE</label>
            <input type="text" name="Daily Internet Usage" placeholder="Minutes" required />

            <label for="daily_time_spent">DAILY TIME SPENT ON WEBSITE</label>
            <input type="text" name="Daily Time Spent on Site" placeholder="Minutes" required />

            <label for="area_income">INCOME</label>
            <input type="text" name="Area Income Square" placeholder="USD (Yearly)" required />

            <label for="age">AGE</label>
            <input type="text" name="Age" placeholder="Age" required />

            <label for="male">MALE</label>
            <div class="radio-group">
                <input type="radio" name="Male" value="1" required> Yes
                <input type="radio" name="Male" value="0" required> No
            </div>

            <label for="north_america">NORTH AMERICA REGION</label>
            <div class="radio-group">
                <input type="radio" name="North America" value="1" required> Yes
                <input type="radio" name="North America" value="0" required> No
            </div>

            <label for="asia">ASIAN REGION</label>
            <div class="radio-group">
                <input type="radio" name="Asia" value="1" required> Yes
                <input type="radio" name="Asia" value="0" required> No
            </div>

            <div class="button-group">
                <input type="submit" value="Submit">
                <input type="reset" value="Reset" onclick="location.href='/'">
            </div>
        </form>
        <h3>{{ prediction }}</h3>
    </div>
</body>

</html>
